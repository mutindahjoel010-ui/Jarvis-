name: Build Jarvis APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Jarvis APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis.apk

      - name: Publish direct APK download on Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Jarvis.apk --clobber
          else
            gh release create latest Jarvis.apk \
              --title "Jarvis Android APK (Latest)" \
              --notes "Download Jarvis.apk directly on your Android phone and tap it to install."
          fi
